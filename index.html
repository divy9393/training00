
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>3D Cube with Full Controls</title>
    <meta name="description" content="3D Cube - Mouse Drag, Zoom, VR Ready">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-orbit-controls-component@0.3.2/dist/aframe-orbit-controls-component.min.js"></script>
    <style> body { margin: 0; } </style>
  </head>
  <body>
    <a-scene background="color: #ECECEC">
      <a-assets>
        <img id="cube-texture" src="cube-image.png">
      </a-assets>

      <!-- The cube -->
      <a-box position="0 1.5 -3" depth="1" height="1" width="1"
             material="src: #cube-texture; repeat: 1 1;"></a-box>

      <!-- Camera rig with orbit controls -->
      <a-entity id="cameraRig" position="0 1.6 4"
                orbit-controls="target: 0 1.5 -3; autoRotate: false; enableDamping: true;
                                dampingFactor: 0.125; rotateSpeed:0.15; zoomSpeed:0.5;
                                minDistance: 2; maxDistance: 10;">
        <a-camera></a-camera>
      </a-entity>
    </a-scene>
  </body>
</html>
