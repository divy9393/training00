
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>3D Cube with Same Image on All Sides</title>
    <meta name="description" content="A-Frame Cube Example">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
      body { margin: 0; }
    </style>
  </head>
  <body>
    <a-scene background="color: #ECECEC">
      <a-assets>
        <img id="cube-texture" src="cube-image.png">
      </a-assets>
      <a-box position="0 1.5 -3" depth="1" height="1" width="1" 
             material="src: #cube-texture; repeat: 1 1;" rotation="0 45 0">
      </a-box>
      <a-camera position="0 1.6 0"></a-camera>
    </a-scene>
  </body>
</html>
