
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>3D Cube with Orbit Controls</title>
    <meta name="description" content="A-Frame Cube with Orbit Controls">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-orbit-controls@1.0.0/dist/aframe-orbit-controls.min.js"></script>
    <style>
      body { margin: 0; }
    </style>
  </head>
  <body>
    <a-scene background="color: #ECECEC">
      <a-assets>
        <img id="cube-texture" src="cube-image.png">
      </a-assets>
      <a-box position="0 1.5 -3" depth="1" height="1" width="1"
             material="src: #cube-texture; repeat: 1 1;">
      </a-box>

      <!-- Orbit Controls Camera Rig -->
      <a-entity id="rig" position="0 1.6 4"
                orbit-controls="target: 0 1.5 -3; enableDamping: true; dampingFactor: 0.25; rotateSpeed: 0.15;">
        <a-camera></a-camera>
      </a-entity>
    </a-scene>
  </body>
</html>
