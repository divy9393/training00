
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>3D Cube with Full Controls</title>
    <meta name="description" content="3D Cube - Mouse Drag, Zoom, VR Ready">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-orbit-controls-component@0.3.2/dist/aframe-orbit-controls-component.min.js"></script>
    <style> body { margin: 0; } </style>
  </head>
  <body>
    <a-scene background="color: #ECECEC">
      <a-assets>
        <img id="cube-texture" src="cube-image.png">
      </a-assets>

      <!-- The cube -->
      <a-box position="0 1.5 -3" depth="1" height="1" width="1"
             material="src: #cube-texture; repeat: 1 1;"></a-box>

      <a-entity id="rig" position="0 1.6 4" movement-controls="fly: true">
        <a-camera wasd-controls="acceleration: 2" look-controls>
          <a-cursor fuse="true" material="color: black; shader: flat"></a-cursor>
        </a-camera>
      </a-entity>
    </a-scene>
  </body>
</html>
